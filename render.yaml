services:
  - type: web
    name: coclea
    runtime: python
    rootDir: radioscl
    buildCommand: ./build.sh
    startCommand: gunicorn radioscl.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.7
