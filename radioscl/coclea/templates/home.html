{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cóclea.cl - Escucha radios online con el clásico reproductor Winamp y personaliza tu experiencia con distintos skins.">
    <meta name="keywords" content="radios online, winamp, skins, reproductor, música, cóclea">
    <meta name="author" content="Cóclea.cl">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <title>Cóclea.cl</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/logo.ico' %}">
</head>

<body>

    <video id="video-fondo" autoplay muted loop playsinline></video>

    <div id="chat-lateral">
        <section id="muro-mensajes">
            <h2>Muro de mensajes</h2>

            <form id="form-muro">
                {% csrf_token %}
                <input type="text" id="nombre" placeholder="Tu nombre" maxlength="30" required>
                <textarea id="mensaje" placeholder="Escribe tu mensaje(max 500 caracteres)" maxlength="500" required></textarea>
                <button type="submit">Enviar</button>
                <p id="estado-muro" aria-live="polite"></p>
            </form>

            <ul id="lista-mensajes">
                {% for m in mensajes %}
                    <li>
                        <strong>{{ m.nombre }}</strong>
                        <small>{{ m.fecha|date:"H:i" }}</small><br>
                        {{ m.mensaje }}
                    </li>
                {% endfor %}
            </ul>
        </section>
    </div>

    <div class="contenedor-main">
        <div class="titulo">
            <h1>Cóclea.cl</h1> 
            <img src="{% static 'img/logo.png' %}" alt="logo" class="logo">
        </div>  
        <div>
        <button id="cambiar-fondo" class="boton-fondo">Cambiar fondo</button>
        <button id="toggle-skins" class="mostrar-skins">Skins</button>
    </div>

    <button id="abrir-mini" class="mini">abrir mini player</button>
    <!--.producto$*5 DESPUES DEL PUNTO NOMBRE X y DESPUES LA CANTIDAD DE DIV--> 
    
    

    <div id="skin-buttons" class="skin-buttons" style="display: none;">
        <ul>
            <li><button data-skin="/static/emisoras/skins/Soul_Reaver.wsz">Soul Reaver</button></li>
            <li><button data-skin="/static/emisoras/skins/future.wsz">Future</button></li>
            <li><button data-skin="/static/emisoras/skins/Sony CDX-MP3.wsz">Sony CDX-MP3</button></li>
            <li><button data-skin="/static/emisoras/skins/Sony_Esprit.wsz">Sony Esprit</button></li>
            <li><button data-skin="/static/emisoras/skins/Winamp_X_v.10.wsz">MacOS X</button></li>
            <li><button data-skin="/static/emisoras/skins/Panasonic.wsz">Panasonic</button></li>
            <li><button data-skin="/static/emisoras/skins/Hitman.wsz">Hitman</button></li>
            <li><button data-skin="/static/emisoras/skins/aqua.wsz">Aqua</button></li>
            <li><button data-skin="/static/emisoras/skins/Pioneer.wsz">Pioneer</button></li>
            <li><button data-skin="/static/emisoras/skins/WindowsMediaPlayer.wsz">WindowsMediaPlayer</button></li>
        </ul>
    </div>


    <div id="winamp-container"></div>

    <script>
        function crearMensaje(nombre, fecha, mensaje) {
            const li = document.createElement("li");
            const strong = document.createElement("strong");
            strong.textContent = nombre;
            const small = document.createElement("small");
            small.textContent = " " + fecha;
            const texto = document.createElement("div");
            texto.textContent = mensaje;
            li.append(strong, small, texto);
            return li;
}
    
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                const cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.startsWith(name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const csrftoken = getCookie("csrftoken");

        const estado = document.getElementById("estado-muro");

        function mostrarEstado(texto, esError) {
            estado.textContent = texto;
            estado.style.color = esError ? "#ff8080" : "#c874b2";
            if (!esError) setTimeout(() => estado.textContent = "", 3000);
        }

        document.getElementById("form-muro").addEventListener("submit", function(e) {
            e.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const mensaje = document.getElementById("mensaje").value.trim();
            if (!nombre || !mensaje) return;

            const boton = e.target.querySelector("button");
            boton.disabled = true;

            const data = new FormData();
            data.append("nombre", nombre);
            data.append("mensaje", mensaje);

            fetch("/publicar-mensaje/", {
                method: "POST",
                headers: { "X-CSRFToken": csrftoken },
                body: data
            })
            .then(res => res.json().catch(() => ({ error: "Error del servidor (" + res.status + ")" })))
            .then(data => {
                if (data.error) { mostrarEstado(data.error, true); return; }

                const fechaLocal = new Date(data.fecha).toLocaleTimeString("es-CL", {
                    day: "2-digit", month: "2-digit", year: "numeric",
                    hour: "2-digit", minute: "2-digit"
                });

                document.getElementById("lista-mensajes").prepend(crearMensaje(data.nombre, fechaLocal, data.mensaje));
                document.getElementById("mensaje").value = "";
                mostrarEstado("Mensaje enviado ✓", false);
            })
            .catch(() => mostrarEstado("No se pudo enviar. Revisa tu conexión.", true))
            .finally(() => boton.disabled = false);
        });
    </script>

    <script>
        function cargarMensajes() {
            fetch("/obtener-mensajes/")
                .then(res => {
                    if (!res.ok) throw new Error("HTTP" + res.status);
                    return res.json();
                })

                .then(data => {
                    const lista = document.getElementById("lista-mensajes");
                    lista.innerHTML = "";

                    data.forEach(m => {
                        const fechaLocal = new Date(m.fecha).toLocaleTimeString("es-CL", {
                            day:"2-digit",
                            month:"2-digit",
                            year:"numeric",
                            hour: "2-digit",
                            minute: "2-digit"
                        });

                        const li = crearMensaje(m.nombre, fechaLocal, m.mensaje);
                        
                        lista.appendChild(li);
                    });
                })
                .catch(err => console.log("No refresca la wea", err));
        }

        // refresca cada 5 segundos
        let intervalo = null;

        function iniciarRefresco() {
            if (intervalo) return;
            cargarMensajes();
            intervalo = setInterval(cargarMensajes, 5000);
        }

        function detenerRefresco() {
            clearInterval(intervalo);
            intervalo = null;
        }

        document.addEventListener("visibilitychange", () => {
            document.hidden ? detenerRefresco() : iniciarRefresco();
        });

        iniciarRefresco();
    </script>


    <script src="https://unpkg.com/webamp@2.3.1/built/webamp.bundle.min.js"></script>
    <script src="{% static 'emisoras/js/mostrar_skins.js' %}"></script>
    <script src="{% static 'emisoras/js/cambiar_fondo.js' %}"></script>
    <script src="{% static 'emisoras/js/reproductor.js' %}"></script>
    <script src="{% static 'emisoras/js/mini_player.js' %}"></script>
</body>
</html>
